# DINO-WM finetune config: bootstraps a small-data per-task run from an
# existing pretrained ckpt. Invoked by run_finetune.sh, which exports
# FINETUNE_FROM / FINETUNE_ROOT / FT_TASK / FT_SPLIT for the data config
# and passes `subdir=ft_<task>_<N>ep training.epochs=<N>` on the command
# line. Matches the layout used by reference/oracle/config/train/lewm_finetune.yaml.
defaults:
  - _self_
  - env: robotwin_finetune
  - encoder: dino
  - action_encoder: proprio
  - proprio_encoder: proprio
  - decoder: vqvae
  - predictor: vit
  # Pretrain ships submitit_slurm; finetune loops over many small jobs
  # locally, so drop the slurm dep and use the basic launcher.
  - override hydra/launcher: basic

ckpt_base_path: ./

# run_finetune.sh overrides this per (task, split). Default keeps single-run
# manual invocations workable.
subdir: ft_${oc.env:FT_TASK,manual}_${oc.env:FT_SPLIT,manual}ep

# Pretrained ckpt produced by train.py (`<run_dir>/checkpoints/model_<E>.pth`).
# When set, train.py loads its submodule weights into the fresh trainer at
# epoch 0; optimizer state and epoch counter are NOT carried over.
finetune_from: ${oc.env:FINETUNE_FROM,null}

hydra:
  # Deterministic run_dir per (task, split) so reruns resume instead of
  # forking a new timestamped subdir. robotwin_policy resolves
  # <ckpt>.parent.parent/hydra.yaml, so dir layout must be
  # <run_dir>/{hydra.yaml, checkpoints/model_<E>.pth}.
  run:
    dir: ${ckpt_base_path}/outputs/${subdir}
  sweep:
    dir: ${ckpt_base_path}/outputs/${subdir}
    subdir: ${hydra.job.num}

training:
  seed: 3072
  # run_finetune.sh overrides this per split (EPOCHS_1=60, EPOCHS_3=45, ...).
  epochs: 30
  # Finetune splits can be tiny (~40 windows @ 1 episode). Keep the batch
  # modest so every split still yields >=1 train batch.
  batch_size: 16
  save_every_x_epoch: 1
  reconstruct_every_x_batch: 500
  num_reconstruct_samples: 6
  encoder_lr: 1e-6
  decoder_lr: 3e-4
  # Lower than pretrain (5e-4) because we start from a converged ckpt.
  predictor_lr: 1e-4
  action_encoder_lr: 1e-4

img_size: 224
# MUST match the pretrain's frameskip: action_encoder is a Conv1d whose
# in_chans = dataset.action_dim_raw * frameskip (14 * fs for robotwin).
# Pretrained ckpts shipped here used frameskip=4 (in_chans=56), so don't
# drop this to 1 unless your pretrain also did. The env yaml comment
# about preprocessed data being "step-aligned" still applies -- it just
# means each frameskip stride covers an extra factor of the HDF5 skip.
frameskip: 4
concat_dim: 1

normalize_action: True

action_emb_dim: 10
num_action_repeat: 1

proprio_emb_dim: 10
num_proprio_repeat: 1

num_hist: 3
num_pred: 1
has_predictor: True
# MPC at eval only queries z_obses (it never decodes), so predictor-only
# finetune is the natural fit -- skipping the decoder saves memory/time.
has_decoder: False

model:
  _target_: models.visual_world_model.VWorldModel
  image_size: ${img_size}
  num_hist: ${num_hist}
  num_pred: ${num_pred}
  train_encoder: False
  train_predictor: True
  train_decoder: False

debug: False

plan_settings:
  plan_cfg_path: null
  planner: ['gd', 'cem']
  goal_source: ['dset', 'random_state']
  goal_H: [5]
  alpha: [0.1, 1]
